# Standard Pipeline Command (BeatSaver download + deploy) — NO flags needed since v0.5314
example_command: |
  python3 tools/full_custom_song_pipeline.py \
      --download-beat-saver-song <MAP_ID> \
      --target <slot_name> \
      --song-name "Song Name" \
      --artist "Artist Name" \
      --deploy --generate-config --deploy-config
